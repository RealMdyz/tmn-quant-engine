# ===== TMN Quant Engine — hedged fair-value arbitrage on Wallex =====
seed: 7
strategy: mm          # mm = AI-steered fair-value market maker (bot/mm_engine.py); arb = hedged arbitrage (bot/arb_engine.py)

challenge:
  package_id: 183                       # trade-credit package of the challenge (unavailable markets come from here)
  initial_capital_tmn: 5000000
  end_time: "2026-10-26T23:50:00+03:30" # official end, extended by Wallex from Fri 23:50 to Mon 23:50 Tehran
  stop_new_entries_minutes_before_end: 240  # no new buys once the wind-down starts (Mon 19:50); MM holds end by 21:20
  wind_down_start_hours_before_end: 4   # holding sleeves are sold in steps from Mon 19:50 (not all at once at 23:10):
  wind_down_steps: 4                    # 75% held at 19:50, 50% at 20:40, 25% at 21:30, 0% at 22:20 (maker sells)
  force_flatten_minutes_before_end: 40  # everything back to Toman by then (taker for whatever is left)

fees:                                   # account tier 1 (overridden by /v1/account/fee in live mode)
  tmn_maker: 0.0025
  tmn_taker: 0.0030
  usdt_maker: 0.0010
  usdt_taker: 0.0013

arb:
  # Coins quoted (both XTMN and XUSDT allowed for package 183). NOTE: this list came from the first
  # backtest, whose profits were an artefact (hedge priced at stale USDT candles — see RESEARCH.md §5).
  # The corrected per-coin samples are too small to rank coins, so the list is kept and every coin is
  # treated alike (pooled prior below); the guards decide per moment whether a coin may quote.
  coins: [FIL, PENGU, AAVE, GALA, ADA, TRX, CAKE, AVAX, WLD, APE, HYPE, SHIB, LINK, DOGE, UNI, PUMP, BNB, SOL]
  max_active_quotes: 8         # quote the 8 markets with the highest expected profit/hour
  quote_tmn: 2000000           # upper bound per resting bid (actual = equity / active, >= hedge minimum);
                               # when guards block coins, the freed capital concentrates on the eligible ones
  requote_up_threshold: 0.003  # fair value DOWN -> requote at once (safety); UP -> only if > 0.3% (keeps queue spot)
  max_quote_age_s: 180
  usdt_maker_timeout_s: 900    # USDT->TMN maker sell falls back to taker after 15 min
  rechoose_margin_s: 600       # bandit re-samples the margin every 10 min (or after a requote)
  probe_every_minutes: 30      # a sidelined market (negative learned edge) is re-tested this often ...
  probe_duration_minutes: 15   # ... with one small quote at the widest margin for this long
  max_probes: 2
  max_abs_deviation: 0.05     # never quote a coin whose Toman and USDT prices disagree by >5% (stale book)
  anomaly_dev: 0.02            # Toman bid persistently >2% below liquidation value ...
  anomaly_minutes: 20          # ... for 20 min -> AI review (likely deposit/withdraw halt)
  # ---- guards (a coin may quote only while all pass; evidence in RESEARCH.md §5) ----
  calm_baseline_s: 1800        # baseline = median Toman-bid deviation over the last 30 min
  calm_window_s: 120           # block if, in the last 2 min, the deviation fell ...
  calm_drop: 0.003             # ... more than 0.3% below that baseline (book already sliding = informed)
  max_baseline_discount: 0.01  # block if the baseline itself is < -1% (dislocated market)
  lv_drop_window_s: 60         # block if the coin/USDT fair value fell ...
  lv_drop: 0.005               # ... more than 0.5% within 60 s (falling market)
  ref_stale_s: 900             # block if the coin/USDT top of book has not changed for 15 min
  usdt_check_every_s: 60       # cross-check USDT/TMN: /v2/depth/all vs /v1/depth vs trade tape
  usdt_max_mismatch: 0.003     # > 0.3% v1/v2 mismatch -> use the /v1 book
  usdt_trade_tolerance: 0.01   # recent USDT/TMN trades > 1% outside the book -> block all quoting
  paper_trades_every_s: 6      # shadow: poll the trade tape of quoted markets this often (fill simulator)
  # Bandit prior for EVERY coin: [margin %, expected net bps per fill, fills per coin per 10 days].
  # Pooled over 29 coins, corrected walk-forward backtest (flash-dip guard, hedge at the next REAL
  # coin/USDT trade, worst of close/low): 1.3% -54 bps (62 fills), 2% -33 (24), 3% +42 (12), 4% n=3.
  # Shallow margins lose; only rare deep flash dips have shown a (small-sample) edge. prior_n is 3,
  # so live fills dominate quickly.
  prior_default: [[1.3, -54.0, 2.1], [2.0, -33.0, 0.83], [3.0, 40.0, 0.41], [4.0, 40.0, 0.1]]
  priors: {}                   # optional per-coin overrides, same shape as prior_default

mm:
  # Candidates (both COIN/TMN and COIN/USDT must be allowed for package 183; others are skipped at
  # start-up). The AI supervisor picks at most `max_markets` of them and a half-spread for each.
  coins: [SOL, SUI, S, LTC, XRP, BNB, ADA, LINK, AAVE, HYPE, ETH, DOGE, TRX, ARB, UNI, FIL, AVAX, BCH, DOT,
          SHIB, PENGU, GALA, CAKE, WLD, APE, ENA, CHZ, IMX]
  max_markets: 3                       # low-risk sleeve: the market maker gets ~20% of the capital
  half_spread_bounds_pct: [0.8, 1.5]   # AI range for h (per side); book backtest (strict fills): 0.2-0.5% lost
                                       # 2-7% of capital, 0.7% ~ -0.3%, 0.8-1.5% ~ +0.2..+0.5% (mostly inventory drift)
  default_half_spread_pct: 1.0         # fallback policy when the LLM is unavailable
  quote_tmn: 330000                    # max size of one resting quote (3 markets x 330k ~ 20% of 5M)
  max_inventory_per_coin_pct: 8        # inventory of one coin <= 8% of equity
  max_inventory_total_pct: 20          # all market-maker inventory <= 20% of equity (its share of the capital)
  skew_k: 0.5                          # long inventory shifts both quotes down by up to k*h (sell sooner, buy less)
  min_spread_to_buy_bps: 80            # only bid while the Toman best ask/best bid gap >= 80 bps: book backtest,
                                       # 80 beat 50 at every h (fewer, better fills); 50 bps = fee round trip
  min_profit_bps: 10                   # an ask stays >= cost + 2 maker fees + this ...
  breakeven_after_min: 30              # ... for 30 min, then >= cost + fees (break-even)
  stop_pct: 1.2                        # stop-loss: inventory value 1.2% below cost -> taker exit
  max_hold_min: 90                     # time stop: inventory older than 90 min -> taker exit
  requote_bps: 15                      # move a quote when its target moved > 0.15% (immediately if safer)
  max_quote_age_s: 300                 # refresh at least every 5 min (keeps request rate well under the limit)
  premium_window_s: 1800               # coin premium vs global fair value = 30-min median
  fv_drop_window_s: 60                 # guard: no buying if the fair value fell ...
  fv_drop: 0.004                       # ... more than 0.4% in 60 s
  slide_window_s: 120                  # guard: no buying if the Toman premium dropped ...
  slide_drop: 0.003                    # ... 0.3% below its 30-min baseline in 2 min
  ref_stale_s: 900                     # guard: no buying if the COIN/USDT top of book froze 15 min
  paper_trades_every_s: 5              # shadow: trade-tape polling per quoted market

portfolio:
  # 3 strategies, allocation chosen by the account owner: low 20% / medium 35% / high 45%.
  #   low    = market maker (mm: above), capped at ~20% of the capital by its quote/inventory limits
  #   medium = "rial" sleeve: BTC/ETH            35%
  #   high   = "beta" sleeve: PEPE/ADA/LINK      45%
  # Selection (python run.py regime-study; 29+1 days hourly; 27 h holds; net of fees; entered while
  # USDT/TMN 48h >= +1%): medium BTC/ETH +0.88% (P(loss) 34%, worst -2.9%, best risk-adjusted of 9
  # candidates incl. USDT, XAUT, USDT/BTC/ETH); high PEPE/ADA/LINK +1.28% (P(loss) 30%, worst -4.3%, best
  # of 8 baskets). CAUTION: positive in the trending first half (Sep 25-Oct 4), slightly negative in the
  # ranging second half (Oct 5-17); USDT/TMN broke out of that range on Oct 21-22.
  orphans: adopt             # start-up: sleeve coins in the account but not in the records are added to the sleeve
  regime_full_pct: 1.0       # USDT/TMN 48h >= +1.0% -> exposure cap 1.0 ...
  regime_half_pct: 1.0       # ... otherwise 0 (entered at 0..+1% the sleeves lost: -0.9% / -2.0%)
  sleeves:
    rial:                      # MEDIUM risk
      # 35% (BTC/ETH 50/50) as approved; live: a restart left ~870k TMN of ETH bought twice (one fill never recorded).
      # The owner chose to keep it in this sleeve: 35% + 17.4% = 52.4%, BTC 1/3, ETH 2/3 (= the coins held).
      capital_pct: 52.4
      assets: {BTC: 0.334, ETH: 0.666}
      stop_pct: 5.0            # disaster stop only: tighter stops cut the winners (3% stop: +0.83% vs +0.88%,
      trail_start_pct: 99      # worst -3.9% vs -2.9%); trailing stop OFF
      trail_gap_pct: 99
      maker_timeout_s: 300     # entry: maker at the best bid, taker after 5 min (shadow: makers filled in 1-3 min)
      wind_down_taker_after_s: 900  # end wind-down: a step unsold by maker ask in 15 min is sold as taker
      usdt_exit_at: "2026-10-23T20:00:00+03:30"   # only used if USDT is ever added (USDT/TMN closes 21:00)
    beta:                      # HIGH risk
      capital_pct: 45
      assets: {PEPE: 0.3334, ADA: 0.3333, LINK: 0.3333}
      universe: [PEPE, ADA, LINK, SHIB, DOGE, LTC, TRX]   # the AI may switch to 2-4 of these, at most every 3 h
      min_reweight_s: 10800
      stop_pct: 7.0            # disaster stop only (worst 27 h window without stop: -4.3%; a 5% stop made it -6.7%)
      trail_start_pct: 99
      trail_gap_pct: 99
      maker_timeout_s: 300
      wind_down_taker_after_s: 900

risk:
  max_position_pct: 0.40        # a single quote never exceeds 40% of equity
  min_order_tmn: 100000        # smallest market-maker bid (exchange minimum 50k): with ~129k TMN free the MM can still trade
  daily_loss_limit_pct: 2.5     # stop quoting for the day after -2.5%
  max_drawdown_pct: 4.0         # circuit breaker: -4% from peak -> flatten + pause ...
  pause_minutes: 60             # ... for 60 min, then resume ...
  size_after_pause: 0.5         # ... at half size
  second_drawdown_pct: 2.0      # a further -2% after resuming -> permanent stop

execution:
  loop_seconds: 2
  max_requests_per_sec: 5

agent:
  enabled: true
  providers:                    # tried in order (failover); cheapest capable model first
    - {name: boxapi, base_url_env: LLM_BASE_URL, api_key_env: LLM_API_KEY, model: gpt-5-mini}
    - {name: avalai, base_url_env: LLM2_BASE_URL, api_key_env: LLM2_API_KEY, model: gpt-5-mini}
  # LLM budget for this project: 1.5 USD for the whole 3 days (hard cap, then fallback policy).
  # policy every 20 min + anomaly reviews ~= 160 calls x ~0.007 USD ~= 1.1 USD expected.
  budget_usd: 1.5               # stop calling the LLM (use fallback policy) once this is spent
  price_per_million_usd: {input: 0.30, output: 2.50}   # conservative estimate for gpt-5-mini via BoxAPI
  policy_every_minutes: 20
  max_calls_per_hour: 6
  max_output_tokens: 2500
  reasoning_effort: low
  tool_output_chars: 4000
  timeout_s: 60
  margin_mult_bounds: [0.9, 2.5]
  usdt_hold_max: 0.40           # agent may hold up to 40% of equity in USDT (rial-weakness bet; set 0 to disable)
  usdt_exit_minutes_before_end: 180   # USDT target forced to 0 this long before the end (time to sell as maker)
  news_feeds:
    - {name: CoinDesk, topic: crypto, url: "https://www.coindesk.com/arc/outboundfeeds/rss/"}
    - {name: Cointelegraph, topic: crypto, url: "https://cointelegraph.com/rss"}
    - {name: Arzdigital, topic: crypto, url: "https://arzdigital.com/feed/"}
    - {name: ISNA-Economy, topic: iran, url: "https://www.isna.ir/rss/tp/34"}
    - {name: Donya-e-Eqtesad, topic: iran, url: "https://donya-e-eqtesad.com/fa/feeds/?p=Y2F0ZWdvcmllcz0xOQ%2C%2C"}

logging:
  dir: logs
  books_every_s: 10            # top of book of every market -> logs/books_<mode>.csv (edge measurement)
