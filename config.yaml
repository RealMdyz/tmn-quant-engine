    BNB: [[0.4, -16.1, 24.0], [0.6, 4.2, 23.0], [0.8, 19.8, 21.0], [1.0, -12.9, 9.0], [1.3, 8.6, 4.0]]
    SOL: [[0.4, -33.2, 17.0], [0.6, 9.5, 11.0], [0.8, 29.9, 11.0], [1.0, -40.0, 4.0], [1.3, -5.1, 3.0]]

risk:
  max_position_pct: 0.25        # a single quote never exceeds 25% of equity
  min_order_tmn: 300000
  daily_loss_limit_pct: 1.5     # stop quoting for the day after -1.5%
  max_drawdown_pct: 3.0         # kill switch: cancel + flatten at -3% from peak
  cooldown_after_loss_min: 0
  trailing_stop_pct: 0.6

execution:
  loop_seconds: 2
  max_requests_per_sec: 5

agent:
  enabled: true
  providers:                    # tried in order (failover); cheapest capable model first
    - {name: boxapi, base_url_env: LLM_BASE_URL, api_key_env: LLM_API_KEY, model: gpt-5-mini}
    - {name: avalai, base_url_env: LLM2_BASE_URL, api_key_env: LLM2_API_KEY, model: gpt-5-mini}
  # LLM budget: the whole hackathon has ~3 USD of credit. Hard caps below keep us far under it:
  # ~1 policy call/hour (+ anomalies) x ~10k tokens ~= 0.005 USD/call -> ~0.3 USD for 3 days.
  budget_usd: 2.0               # stop calling the LLM (use fallback policy) once this is spent
  price_per_million_usd: {input: 0.30, output: 2.50}   # conservative estimate for gpt-5-mini via BoxAPI
  policy_every_minutes: 60
  max_calls_per_hour: 3
  max_output_tokens: 2500
  reasoning_effort: low
  tool_output_chars: 2500
  timeout_s: 60
  margin_mult_bounds: [0.9, 2.5]
  usdt_hold_max: 0.30           # agent may keep at most 30% of equity in USDT (rial hedge)
  news_feeds:
    - {name: CoinDesk, topic: crypto, url: "https://www.coindesk.com/arc/outboundfeeds/rss/"}
    - {name: Cointelegraph, topic: crypto, url: "https://cointelegraph.com/rss"}
    - {name: Arzdigital, topic: crypto, url: "https://arzdigital.com/feed/"}
    - {name: ISNA-Economy, topic: iran, url: "https://www.isna.ir/rss/tp/34"}
    - {name: Donya-e-Eqtesad, topic: iran, url: "https://donya-e-eqtesad.com/fa/feeds/?p=Y2F0ZWdvcmllcz0xOQ%2C%2C"}

logging:
  dir: logs
