# ===== TMN Quant Engine — hedged fair-value arbitrage on Wallex =====
seed: 7

challenge:
  package_id: 183                       # trade-credit package of the challenge (unavailable markets come from here)
  initial_capital_tmn: 5000000
  end_time: "2026-10-23T23:50:00+03:30" # official end (Friday 23:50 Tehran)
  stop_new_entries_minutes_before_end: 75
  force_flatten_minutes_before_end: 40  # everything back to Toman by then

fees:                                   # account tier 1 (overridden by /v1/account/fee in live mode)
  tmn_maker: 0.0025
  tmn_taker: 0.0030
  usdt_maker: 0.0010
  usdt_taker: 0.0013

arb:
  # Coins quoted (both XTMN and XUSDT allowed for package 183). Selected by the walk-forward backtest:
  # only markets with positive net edge after ALL fees at some margin. Rejected (adverse selection /
  # no edge): ETH, XRP, PEPE, BTC, ARB, ENA, S, SUI, LTC, USOON, XAUT.
  coins: [FIL, PENGU, AAVE, GALA, ADA, TRX, CAKE, AVAX, WLD, APE, HYPE, SHIB, LINK, DOGE, UNI, PUMP, BNB, SOL]
  max_active_quotes: 8         # quote the 8 markets with the highest expected profit/hour
  quote_tmn: 1000000           # upper bound per resting bid (actual = equity / active, >= hedge minimum)
  requote_threshold: 0.0015    # cancel/replace when the safe price moves > 0.15%
  max_quote_age_s: 180
  usdt_maker_timeout_s: 900    # USDT->TMN maker sell falls back to taker after 15 min
  rechoose_margin_s: 600       # bandit re-samples the margin every 10 min (or after a requote)
  anomaly_dev: 0.02            # Toman bid persistently >2% below liquidation value ...
  anomaly_minutes: 20          # ... for 20 min -> AI review (likely deposit/withdraw halt)
  use_backtest_priors: false   # true: refresh priors from logs/backtest/arb_summary.json
  # priors: [margin %, expected net bps per fill, fills per 10 days] — walk-forward backtest on
  # 10 days of real Wallex 1-minute data (2026-10-12..22), pessimistic fill/hedge model
  priors:
    FIL: [[0.4, 9.6, 622.8], [0.6, 28.7, 515.8], [0.8, 47.0, 420.9], [1.0, 65.6, 386.9], [1.3, 95.4, 303.9]]
    PENGU: [[0.4, 21.9, 483.8], [0.6, 41.7, 435.8], [0.8, 60.9, 374.9], [1.0, 73.7, 242.9], [1.3, 105.5, 154.9]]
    AAVE: [[0.4, 18.8, 257.9], [0.6, 38.2, 219.9], [0.8, 62.5, 198.9], [1.0, 84.1, 152.9], [1.3, 90.4, 49.0]]
    GALA: [[0.4, 6.3, 275.9], [0.6, 22.7, 221.9], [0.8, 38.3, 180.9], [1.0, 58.4, 146.9], [1.3, 84.6, 114.0]]
    ADA: [[0.4, -15.2, 212.9], [0.6, 1.4, 188.9], [0.8, 16.8, 149.9], [1.0, 31.8, 131.0], [1.3, 63.3, 109.0]]
    TRX: [[0.4, 25.6, 172.9], [0.6, 50.0, 132.0], [0.8, 70.0, 84.0], [1.0, 86.3, 42.0], [1.3, 132.8, 29.0]]
    CAKE: [[0.4, 15.6, 191.9], [0.6, 36.3, 150.9], [0.8, 58.7, 110.0], [1.0, 60.6, 55.0], [1.3, 81.4, 40.0]]
    AVAX: [[0.4, 6.5, 224.9], [0.6, 20.9, 169.9], [0.8, 36.0, 128.0], [1.0, 54.8, 111.0], [1.3, 20.4, 30.0]]
    WLD: [[0.4, -6.6, 268.9], [0.6, 3.5, 193.9], [0.8, 17.2, 159.9], [1.0, 10.5, 99.0], [1.3, 41.3, 81.0]]
    APE: [[0.4, -28.6, 458.8], [0.6, -7.8, 298.9], [0.8, -6.7, 170.9], [1.0, 23.7, 116.0], [1.3, 23.6, 44.0]]
    HYPE: [[0.4, 13.6, 85.0], [0.6, 41.8, 60.0], [0.8, 44.9, 30.0], [1.0, 52.1, 17.0], [1.3, -64.6, 3.0]]
    SHIB: [[0.4, 9.8, 81.0], [0.6, 22.0, 52.0], [0.8, 36.1, 39.0], [1.0, 70.3, 26.0], [1.3, 122.6, 4.0]]
    LINK: [[0.4, -25.9, 53.0], [0.6, -17.9, 28.0], [0.8, 16.7, 24.0], [1.0, 38.4, 18.0], [1.3, 132.4, 13.0]]
    DOGE: [[0.4, -20.7, 72.0], [0.6, 3.3, 51.0], [0.8, 19.9, 41.0], [1.0, 47.6, 34.0], [1.3, 62.5, 22.0]]
    UNI: [[0.4, -10.7, 120.0], [0.6, -3.2, 70.0], [0.8, 17.2, 54.0], [1.0, 35.0, 43.0], [1.3, 43.0, 26.0]]
