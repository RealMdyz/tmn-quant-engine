# Deploys every push to main to Liara (Iranian cloud, reaches Wallex).
# Needs repo secrets: LIARA_API_TOKEN and LIARA_APP_NAME.
name: deploy-liara
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @liara/cli@latest
      - run: liara deploy --app "${{ secrets.LIARA_APP_NAME }}" --api-token "${{ secrets.LIARA_API_TOKEN }}" --platform docker --port 8080 --detach
